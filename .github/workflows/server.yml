name: Server

on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - "src/core/**"
      - "src/libs/json/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "src/core/**"
      - "src/libs/json/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.backend }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nascent
          POSTGRES_PASSWORD: nascent
          POSTGRES_DB: nascent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nascent"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./native
          pip install -e ".[dev,postgres]"

      - name: Select backend
        if: matrix.backend == 'postgres'
        run: |
          echo "NASCENT_TEST_DATABASE_URL=postgresql+psycopg://nascent:nascent@localhost:5432/nascent_test" >> "$GITHUB_ENV"
          echo "NASCENT_TEST_REDIS_URL=redis://localhost:6379/0" >> "$GITHUB_ENV"

      - name: Lint
        if: matrix.backend == 'sqlite'
        run: ruff check .

      - name: Test
        run: pytest -q -rs

  deploy:
    name: Deploy to a fresh server
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint shell scripts
        run: shellcheck -S warning server/deploy/nginx/start.sh

      - name: Validate compose file
        working-directory: server/deploy
        run: NASCENT_POSTGRES_PASSWORD=x docker compose config -q

      - name: Install Ansible
        working-directory: server/deploy/ansible
        run: |
          pipx install ansible-core
          ansible-galaxy collection install -r requirements.yml
          sudo git config --system --add safe.directory '*'

      - name: Point the playbook at this runner
        working-directory: server/deploy/ansible
        run: |
          cat > inventory.yml <<EOF
          nascent:
            hosts:
              runner:
                ansible_connection: local
                ansible_python_interpreter: /usr/bin/python3
            vars:
              nascent_repo: ${{ github.workspace }}
              nascent_ref: ${{ github.sha }}
              nascent_workers: 1
              nascent_configure_firewall: false
          EOF
          ansible-playbook -i inventory.yml deploy.yml --syntax-check

      - name: Deploy
        working-directory: server/deploy/ansible
        run: ansible-playbook -i inventory.yml deploy.yml

      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1/api/v1/health
          curl -fsS -X POST http://127.0.0.1/api/v1/auth/register -H "Content-Type: application/json" -d '{"username": "ci_user", "email": "ci@example.com", "password": "a long password"}'
          cd /opt/nascent/src/server/deploy
          sudo docker compose ps
          sudo docker compose exec -T backup pg_dump --format=custom --file=/backups/ci.dump
          sudo ls -l /opt/nascent/data/backups

      - name: Deploy again
        working-directory: server/deploy/ansible
        run: |
          ansible-playbook -i inventory.yml deploy.yml
          curl -fsS http://127.0.0.1/api/v1/users/ci_user

      - name: Show logs
        if: failure()
        working-directory: /opt/nascent/src/server/deploy
        run: sudo docker compose logs --tail 50 || true
