name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            os_name: win
            arch: x86_64
            shell: pwsh
            cc: cl
            cxx: cl
          - os: ubuntu-22.04
            os_name: linux
            arch: x86_64
            shell: bash
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04-arm
            os_name: linux
            arch: arm64
            shell: bash
            cc: gcc-13
            cxx: g++-13
          - os: macos-15
            os_name: mac
            arch: arm64
            shell: bash
            cc: clang
            cxx: clang++
            osx_arch: arm64
          - os: macos-15-intel
            os_name: mac
            arch: x86_64
            shell: bash
            cc: clang
            cxx: clang++
            osx_arch: x86_64

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9A-Za-z]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must look like 1.0.0 or 1.0.0.rc1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl-dev libcurl4-openssl-dev gcc-13 g++-13

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} "-DNASCENT_VERSION=${{ github.ref_name }}" "-DNASCENT_PACKAGE_ARCH=${{ matrix.arch }}" ${{ matrix.osx_arch && format('-DCMAKE_OSX_ARCHITECTURES={0}', matrix.osx_arch) || '' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target portable_zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nascent-${{ matrix.os_name }}-${{ matrix.arch }}
          path: build/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+\. ]]; then
            prerelease="--prerelease"
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nascent $GITHUB_REF_NAME" \
              --notes "" \
              $prerelease
          fi
