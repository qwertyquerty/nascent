name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    name: Game (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            shell: pwsh
            cc: cl
            cxx: cl
          - name: Windows Clang
            os: windows-latest
            shell: pwsh
            cc: clang-cl
            cxx: clang-cl
          - name: Windows MinGW GCC
            os: windows-latest
            shell: msys2 {0}
            msys2: true
            cc: gcc
            cxx: g++
          - name: Linux GCC
            os: ubuntu-24.04
            shell: bash
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            shell: bash
            cc: clang
            cxx: clang++
          - name: macOS Clang
            os: macos-15
            shell: bash
            cc: clang
            cxx: clang++

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libgl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows' && !matrix.msys2
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up MSYS2
        if: matrix.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  server:
    name: Server (${{ matrix.backend }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nascent
          POSTGRES_PASSWORD: nascent
          POSTGRES_DB: nascent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nascent"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./native
          pip install -e ".[dev,postgres]"

      - name: Select backend
        if: matrix.backend == 'postgres'
        run: |
          echo "NASCENT_TEST_DATABASE_URL=postgresql+psycopg://nascent:nascent@localhost:5432/nascent_test" >> "$GITHUB_ENV"
          echo "NASCENT_TEST_REDIS_URL=redis://localhost:6379/0" >> "$GITHUB_ENV"

      - name: Lint
        if: matrix.backend == 'sqlite'
        run: ruff check .

      - name: Test
        run: pytest -q -rs

