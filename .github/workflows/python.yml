name: Python package

on:
  push:
    tags: ["py-v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "python/**"
      - "server/native/**"
      - "src/core/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Where to publish the built package
        type: choice
        options: ["nowhere", "testpypi", "pypi"]
        default: "nowhere"

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.1

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "py-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build source package
        run: pipx run build --sdist

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'pypi' }}
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/py-v') || (github.event_name == 'workflow_dispatch' && inputs.publish != 'nowhere')
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'pypi' }}
    permissions:
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.publish == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
