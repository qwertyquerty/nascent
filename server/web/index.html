<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="nascent-api" content="/api/v1">
    <meta name="theme-color" content="#00b1e1">
    <title>Nascent</title>
    <script>document.documentElement.classList.add("js");</script>
    <style>[v-cloak] { display: none !important; } .js .prerender { display: none; }</style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="icon" type="image/png" href="/logo_n.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preload" href="/display_font.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css" integrity="sha384-tl5h4XuWmVzPeVWU0x8bx0j/5iMwCBduLEgZ+2lH4Wjda+4+q3mpCww74dgAB3OX" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js" integrity="sha384-W/1Fp/LgAYO/oTn9Gs+PbeWuMuq1eQCnUMPCeg8POmMYchhzxctjEqtbiCIxDOON" crossorigin="anonymous"></script>
    <script src="/palette.js" defer></script>
    <script src="/replay.js" defer></script>
    <script src="/difficulty.js" defer></script>
    <script src="/diffv3.js" defer></script>
    <script src="/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<!--prerender-->
<template id="app-template">
    <nav v-if="!['difficulty', 'diffv2', 'diffv3'].includes(route.name)" class="navbar has-shadow" aria-label="Main">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item" href="/" aria-label="Nascent home"><img class="nav-logo" src="/logo_n.png" alt=""></a>
                <button type="button" class="navbar-burger" :class="{'is-active': menuOpen}" :aria-expanded="menuOpen" aria-controls="main-menu" aria-label="Menu" @click="menuOpen = !menuOpen">
                    <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
                </button>
            </div>
            <div id="main-menu" class="navbar-menu" :class="{'is-active': menuOpen}">
                <div class="navbar-start">
                    <a v-for="[path, label, names] in [['/', 'Home', ['home']], ['/leaderboard', 'Leaderboard', ['leaderboard']], ['/charts', 'Charts', ['charts', 'chart']], ['/plays', 'Plays', ['plays', 'play']], ['/stats', 'Stats', ['stats']]]"
                        class="navbar-item" :class="{'is-active': names.includes(route.name)}" :href="path" :aria-current="names.includes(route.name) ? 'page' : null">{{ label }}</a>
                </div>
                <div class="navbar-end">
                    <div v-if="staff" class="navbar-item"><a class="button is-small is-warning is-light" href="/staff">Review</a></div>
                    <div class="navbar-item"><player-search></player-search></div>
                    <a v-if="user" class="navbar-item" :class="{'is-active': route.name === 'account'}" href="/account" :aria-current="route.name === 'account' ? 'page' : null">{{ user.username }}</a>
                    <a v-else class="navbar-item" :class="{'is-active': route.name === 'login'}" href="/login">Sign in</a>
                    <div class="navbar-item"><download-button :release="release" size="is-small" compact></download-button></div>
                </div>
            </div>
        </div>
    </nav>

    <main id="content" class="section" tabindex="-1" :aria-busy="loading">
        <div class="container" :class="{'is-refreshing': loading && view}">
            <p v-if="formNotice" class="notification is-success is-light" role="status">{{ formNotice }}</p>
            <div v-if="error" class="notification is-danger is-light" role="alert">{{ error }}</div>
            <logo-loader v-else-if="!view"></logo-loader>

            <template v-else-if="route.name === 'home'">
                <section class="hero">
                    <hero-notes></hero-notes>
                    <div class="hero-body">
                        <h1 class="title"><img class="home-logo" src="/logo.png" alt="Nascent"></h1>
                        <p class="subtitle hero-tagline">A vertical scrolling rhythm game passion project.</p>
                        <div class="hero-actions">
                            <download-button :release="release" size="is-medium"></download-button>
                            <a class="button is-medium is-link is-outlined" href="/leaderboard">Leaderboards</a>
                            <a class="button is-medium is-link is-outlined" href="https://discord.gg/f538azJwXT" target="_blank" rel="noopener">Join the Discord</a>
                        </div>
                    </div>
                </section>

                <div class="columns is-multiline is-mobile">
                    <div v-for="[label, value] in [
                        ['Players', $f.number(view.stats.players)],
                        ['Ranked players', $f.number(view.stats.ranked_players)],
                        ['Plays', $f.number(view.stats.plays)],
                        ['Ranked plays', $f.number(view.stats.ranked_plays)],
                        ['Ranked charts', $f.number(view.stats.ranked_charts)],
                        ['Time played', $f.playtime(view.stats.total_playtime_ms)],
                    ]" class="column is-2-desktop is-4-tablet is-6-mobile">
                        <div class="box stat"><p class="stat-label">{{ label }}</p><p class="stat-value">{{ value }}</p></div>
                    </div>
                </div>
                <div class="columns">
                    <div class="column">
                        <h2 class="title is-4">Top players</h2>
                        <key-tabs :current="view.keyCount" path="/" :params="{plays_key_count: route.params.plays_key_count}" label="Top players key mode"></key-tabs>
                        <player-table :entries="view.board.entries" :caption="'Top ' + view.keyCount + 'K players'"></player-table>
                        <a class="button is-small" :href="$link.to('/leaderboard', {key_count: view.keyCount})">Full {{ view.keyCount }}K leaderboard</a>
                    </div>
                    <div class="column">
                        <h2 class="title is-4">Top plays</h2>
                        <key-tabs :current="view.playsKeyCount" path="/" param="plays_key_count" :params="{key_count: route.params.key_count}" label="Top plays key mode"></key-tabs>
                        <play-table :plays="view.topPlays" show-user compact empty="No ranked plays yet." :caption="'Top ' + view.playsKeyCount + 'K plays'"></play-table>
                        <a class="button is-small" :href="$link.to('/plays', {key_count: view.playsKeyCount, sort: 'performance'})">All top {{ view.playsKeyCount }}K plays</a>
                    </div>
                </div>
            </template>

            <template v-else-if="route.name === 'leaderboard'">
                <h1 class="title">{{ view.keyCount }}K leaderboard</h1>
                <p class="subtitle">{{ $f.number(view.total) }} ranked players</p>
                <key-tabs :current="view.keyCount" path="/leaderboard" :params="{sort: route.params.sort}"></key-tabs>
                <podium :entries="view.podium"></podium>
                <pager :total="view.total" top></pager>
                <player-table :entries="view.entries" detailed sortable :caption="view.keyCount + 'K leaderboard'"></player-table>
                <pager :total="view.total"></pager>
            </template>

            <template v-else-if="route.name === 'plays'">
                <h1 class="title">Plays</h1>
                <p class="subtitle">{{ $f.number(view.total) }} {{ view.keyCount }}K {{ view.performance ? 'ranked plays' : 'plays' }}</p>
                <div class="tabs">
                    <ul aria-label="Order">
                        <li :class="{'is-active': !view.performance}"><a :href="$link.to('/plays', {key_count: view.keyCount})" :aria-current="!view.performance ? 'page' : null">Recent</a></li>
                        <li :class="{'is-active': view.performance}"><a :href="$link.to('/plays', {key_count: view.keyCount, sort: 'performance'})" :aria-current="view.performance ? 'page' : null">Top performance</a></li>
                    </ul>
                </div>
                <key-tabs :current="view.keyCount" path="/plays" :params="{sort: route.params.sort}"></key-tabs>
                <pager :total="view.total" top></pager>
                <play-table :plays="view.plays" show-user :empty="view.performance ? 'No ranked plays yet.' : 'No plays yet.'" caption="Plays"></play-table>
                <pager :total="view.total"></pager>
            </template>

            <template v-else-if="route.name === 'play'">
                <p class="is-size-6 mb-2"><a :href="$link.user(view.play.user.username)">{{ view.play.user.username }}</a> &middot; <rel-time :value="view.play.submitted_at"></rel-time>
                    <button v-if="user?.id !== view.play.user.id" type="button" class="button is-ghost is-small report-link" @click="openReport('play', view.play.id, 'Play by ' + view.play.user.username)">Report play</button>
                </p>
                <h1 class="title is-3 mb-1"><a :href="$link.chart(view.play.chart.hash, view.play.rate)">{{ view.titles.main }}</a></h1>
                <p class="subtitle is-6 mb-4"><span v-if="view.titles.sub" class="has-text-grey">{{ view.titles.sub }} &middot; </span>[{{ view.play.chart.difficulty_name }}] by {{ view.play.chart.mapper }}</p>

                <div class="play-summary box">
                    <span class="grade play-grade" :class="'grade-' + view.play.grade">{{ view.play.grade }}</span>
                    <div v-for="[label, value, extra, color] in [
                        ['Accuracy', $f.accuracy(view.play.accuracy)],
                        ['Performance', view.play.ranked ? $f.performance(view.play.performance) : 'Unranked'],
                        ['Rate', $f.rate(view.play.rate), view.play.rate !== 1 ? 'rate-changed' : ''],
                        ['Max combo', $f.number(view.play.max_combo)],
                        ['Mean error', $f.error(view.play.average_error)],
                        ['Difficulty', $f.performance(view.play.difficulty), 'difficulty-number', $f.difficultyColor(view.play.difficulty)],
                    ]" class="play-stat">
                        <p class="stat-label">{{ label }}</p><p class="stat-value" :class="extra" :style="color ? {color} : null">{{ value }}</p>
                    </div>
                    <div v-if="view.leaderboard" class="play-stat">
                        <p class="stat-label">Leaderboard at {{ $f.rate(view.leaderboard.rate) }}</p>
                        <p class="stat-value"><a :href="$link.chart(view.play.chart.hash, view.leaderboard.rate)"><rank-cell :rank="view.leaderboard.rank"></rank-cell></a> <span class="is-size-6 has-text-grey">of {{ $f.number(view.leaderboard.total) }}</span></p>
                    </div>
                </div>

                <div class="tags mb-4" aria-label="Judgements">
                    <span v-for="[score, count] in Object.entries(view.play.score_counts).filter(([score]) => score !== 'NONE')" :key="score" class="tag is-medium judgement-count">
                        <span class="judgement-name" :class="'judgement-' + score.toLowerCase()">{{ score }}</span>{{ $f.number(count) }}
                    </span>
                    <span v-if="view.play.status === 'rejected'" class="tag is-medium is-warning is-light">rejected</span>
                    <span v-if="view.play.is_chart_best" class="tag is-medium is-success is-light">Personal best</span>
                </div>

                <other-games v-if="view.timeline" :notes="view.timeline.notes" :hit-accuracy="view.play.chart.hit_accuracy"></other-games>

                <div v-if="staff && view.play.flags && view.play.status === 'pending_review'" class="box review-item">
                    <p class="has-text-weight-semibold mb-2">Waiting for review</p>
                    <ul class="review-flags mb-3">
                        <li v-for="(flag, index) in view.play.flags" :key="index"><strong>{{ flag.message }}</strong> <span class="has-text-grey">{{ $f.flag(flag) }}</span></li>
                    </ul>
                    <p v-if="staffError" class="help is-danger mb-2" role="alert">{{ staffError }}</p>
                    <div class="field has-addons review-actions">
                        <div class="control is-expanded"><input class="input is-small" v-model="reviewNotes[view.play.id]" placeholder="Note (optional)" aria-label="Review note"></div>
                        <div class="control"><button type="button" class="button is-small is-success" :disabled="reviewBusy === view.play.id" @click="review(view.play, 'approve')">Approve</button></div>
                        <div class="control"><button type="button" class="button is-small is-danger" :disabled="reviewBusy === view.play.id" @click="review(view.play, 'reject')">Reject</button></div>
                    </div>
                </div>

                <div v-if="staff && view.play.status !== 'pending_review'" class="box staff-tools">
                    <p class="has-text-weight-semibold mb-2">Staff <span v-if="view.play.status === 'rejected'" class="has-text-grey has-text-weight-normal">&middot; this play was rejected</span></p>
                    <p v-if="view.play.review_note" class="has-text-grey mb-2">Note: {{ view.play.review_note }}</p>
                    <p v-if="staffError" class="help is-danger mb-2" role="alert">{{ staffError }}</p>
                    <div class="field has-addons review-actions">
                        <div class="control is-expanded"><input class="input is-small" v-model="reviewNotes[view.play.id]" placeholder="Note (optional)" aria-label="Moderation note"></div>
                        <div class="control">
                            <button v-if="view.play.status === 'rejected'" type="button" class="button is-small is-success" :disabled="reviewBusy === view.play.id" @click="review(view.play, 'approve')">Restore play</button>
                            <button v-else type="button" class="button is-small is-danger" :disabled="reviewBusy === view.play.id" @click="review(view.play, 'reject')">Reject play</button>
                        </div>
                    </div>
                </div>

                <template v-if="view.timeline">
                    <h2 class="title is-4">Replay</h2>
                    <replay-viewer :key="route.path + ':' + view.startAt" :timeline="view.timeline" :start-at="view.startAt" :share-url="$link.play(view.play.id)" :download-url="'/api/v1/plays/' + view.play.id + '/replay'"></replay-viewer>
                </template>
                <template v-else>
                    <p class="has-text-grey">The replay for this play couldn't be loaded.</p>
                    <a class="button is-small mt-3" :href="'/api/v1/plays/' + view.play.id + '/replay'" download>Download replay file</a>
                </template>
            </template>

            <template v-else-if="route.name === 'user'">
                <h1 class="title">
                    {{ view.user.username }}
                    <span v-if="view.user.role !== 'user'" class="tag is-info is-light">{{ view.user.role }}</span>
                    <span v-if="view.user.is_restricted" class="tag is-danger is-light">restricted</span>
                </h1>
                <p class="subtitle is-6 has-text-grey">
                    <span v-if="view.strongest && view.strongest.global_rank" class="profile-standing">
                        {{ view.strongest.key_count }}K <rank-cell :rank="view.strongest.global_rank"></rank-cell> &middot; {{ $f.standing(view.strongest.global_rank, view.strongest.ranked_players) }} &middot;
                        <template v-if="view.strongest.peak_rank">peak <span :title="$f.day(view.strongest.peak_rank_day)">{{ $f.rank(view.strongest.peak_rank) }}</span> &middot;</template>
                    </span>
                    Joined <rel-time :value="view.user.created_at"></rel-time> &middot; last played <rel-time :value="view.user.last_played_at"></rel-time>
                    <button v-if="user?.id !== view.user.id" type="button" class="button is-ghost is-small report-link" @click="openReport('player', view.user.id, view.user.username)">Report player</button>
                </p>
                <div v-if="staff && user?.id !== view.user.id" class="box staff-tools">
                    <p class="has-text-weight-semibold mb-2">Staff</p>
                    <p v-if="staffError" class="help is-danger mb-2" role="alert">{{ staffError }}</p>
                    <div class="field is-grouped is-grouped-multiline">
                        <div class="control">
                            <button v-if="view.user.is_restricted" type="button" class="button is-small is-success is-light" :disabled="reviewBusy === 'user-' + view.user.id" @click="restrictUser(view.user, false)">Lift restriction</button>
                            <button v-else type="button" class="button is-small is-danger is-light" :disabled="reviewBusy === 'user-' + view.user.id" @click="restrictUser(view.user, true)">Restrict player</button>
                        </div>
                        <div v-if="admin" class="control">
                            <div class="select is-small">
                                <select :value="view.user.role" aria-label="Role" :disabled="reviewBusy === 'user-' + view.user.id" @change="setRole(view.user, $event.target.value)">
                                    <option v-for="role in roles" :key="role" :value="role">{{ role }}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <p class="help">Restricted players disappear from every leaderboard and can't submit plays or reports.</p>
                </div>
                <div class="columns is-multiline is-mobile">
                    <div v-for="[label, value] in [
                        ['Plays', $f.number(view.user.stats.play_count)],
                        ['Ranked plays', $f.number(view.user.stats.ranked_play_count)],
                        ['Notes hit', $f.number(view.user.stats.total_hits)],
                        ['Time played', $f.playtime(view.user.stats.total_playtime_ms)],
                        ['Max combo', $f.number(view.user.stats.max_combo)],
                    ]" class="column is-2-desktop is-4-tablet is-6-mobile">
                        <div class="box stat"><p class="stat-label">{{ label }}</p><p class="stat-value">{{ value }}</p></div>
                    </div>
                </div>
                <ul class="grade-counts mb-5" aria-label="Grades on best plays">
                    <li v-for="grade in 'XSABCDEF'" :key="grade"><span class="grade" :class="'grade-' + grade">{{ grade }}</span>{{ $f.number(view.user.stats.grade_counts[grade]) }}</li>
                </ul>

                <h2 class="title is-4">Key modes</h2>
                <div class="table-container">
                    <table class="table is-fullwidth is-hoverable">
                        <caption class="is-sr-only">Stats per key mode</caption>
                        <thead><tr>
                            <th scope="col">Mode</th><th scope="col" class="is-numeric">Rank</th><th scope="col" class="is-numeric">Percentile</th><th scope="col" class="is-numeric is-hidden-mobile">Peak</th><th scope="col" class="is-numeric">Performance</th>
                            <th scope="col" class="is-numeric">Accuracy</th><th scope="col" class="is-numeric is-hidden-mobile">Ranked plays</th><th scope="col" class="is-numeric is-hidden-mobile">Time played</th>
                        </tr></thead>
                        <tbody><tr v-for="mode in view.user.key_modes" :key="mode.key_count" :class="{'is-selected-mode': mode.key_count === view.keyCount}">
                            <th scope="row"><a :href="$link.user(view.user.username, {key_count: mode.key_count, tab: route.params.tab})">{{ mode.key_count }}K</a></th>
                            <td class="is-numeric"><rank-cell :rank="mode.global_rank"></rank-cell></td>
                            <td class="is-numeric">{{ $f.standing(mode.global_rank, mode.ranked_players) || "—" }}</td>
                            <td class="is-numeric is-hidden-mobile"><span :title="mode.peak_rank_day ? $f.day(mode.peak_rank_day) : null">{{ $f.rank(mode.peak_rank) }}</span></td>
                            <td class="is-numeric">{{ $f.performance(mode.performance) }}</td>
                            <td class="is-numeric">{{ $f.accuracy(mode.accuracy) }}</td>
                            <td class="is-numeric is-hidden-mobile">{{ $f.number(mode.ranked_play_count) }}</td>
                            <td class="is-numeric is-hidden-mobile">{{ $f.playtime(mode.total_playtime_ms) }}</td>
                        </tr></tbody>
                    </table>
                </div>

                <key-tabs v-if="view.modes.length" class="mt-5" :current="view.keyCount" :path="'/users/' + encodeURIComponent(view.user.username)" :params="{tab: route.params.tab}"
                    :counts="view.modes.map((mode) => mode.key_count)" label="Key mode for the rest of the page"></key-tabs>

                <div class="columns mb-4">
                    <div class="column is-two-thirds-tablet">
                        <template v-if="view.activity">
                            <h2 class="title is-4">{{ view.modes.length ? view.keyCount + 'K activity' : 'Activity' }}</h2>
                            <activity-heatmap class="mb-5" :activity="view.activity"></activity-heatmap>
                        </template>
                        <template v-if="view.history">
                            <h2 class="title is-4">{{ view.keyCount }}K history</h2>
                            <history-graph :history="view.history"></history-graph>
                            <skill-scatter class="mt-4" :key="view.keyCount" :username="view.user.username" :key-count="view.keyCount"></skill-scatter>
                        </template>
                    </div>
                    <div v-if="view.activity" class="column">
                        <h2 class="title is-4">Favorite charts</h2>
                        <ol v-if="view.activity.favorite_charts.length" class="favorite-charts">
                            <li v-for="entry in view.activity.favorite_charts" :key="entry.chart.hash">
                                <a :href="$link.chart(entry.chart.hash)">{{ entry.chart.artist }} - {{ entry.chart.title }}</a> <span class="has-text-grey">[{{ entry.chart.difficulty_name }}]</span>
                                <p class="is-size-7 has-text-grey">{{ entry.chart.key_count }}K &middot; {{ $f.plural(entry.plays, 'play') }} &middot; best {{ $f.accuracy(entry.best_accuracy) }} &middot; last <rel-time :value="entry.last_played_at"></rel-time></p>
                            </li>
                        </ol>
                        <p v-else class="has-text-grey">No plays yet.</p>
                    </div>
                </div>

                <div class="tabs mt-5">
                    <ul aria-label="Plays">
                        <li v-for="[recent, label] in [[false, 'Best plays'], [true, 'Recent plays']]" :key="label" :class="{'is-active': recent === view.recent}">
                            <a :href="$link.user(view.user.username, {key_count: route.params.key_count, tab: recent ? 'recent' : 'best'})" :aria-current="recent === view.recent ? 'page' : null">{{ label }}</a>
                        </li>
                    </ul>
                </div>
                <pager :total="view.total" top></pager>
                <play-table :plays="view.plays" :caption="(view.modes.length ? view.keyCount + 'K ' : '') + (view.recent ? 'recent plays' : 'best plays')"></play-table>
                <pager :total="view.total"></pager>
            </template>

            <template v-else-if="route.name === 'stats'">
                <h1 class="title">Stats</h1>
                <p class="subtitle">Everything happening on Nascent</p>

                <div class="columns is-multiline is-mobile">
                    <div v-for="[label, value] in [
                        ['Players', $f.number(view.stats.players)],
                        ['Ranked players', $f.number(view.stats.ranked_players)],
                        ['Plays', $f.number(view.stats.plays)],
                        ['Ranked plays', $f.number(view.stats.ranked_plays)],
                        ['Charts', $f.number(view.stats.charts)],
                        ['Ranked charts', $f.number(view.stats.ranked_charts)],
                        ['Time played', $f.playtime(view.stats.total_playtime_ms)],
                        ['Plays this week', $f.number(view.activity.week.plays)],
                        ['Active this week', $f.number(view.activity.week.active_players)],
                        ['New this week', $f.number(view.activity.week.new_players)],
                    ]" class="column is-one-fifth-desktop is-4-tablet is-6-mobile">
                        <div class="box stat"><p class="stat-label">{{ label }}</p><p class="stat-value">{{ value }}</p></div>
                    </div>
                </div>

                <h2 class="title is-4">Plays per day</h2>
                <daily-bars class="mb-5" :days="view.activity.plays_per_day"></daily-bars>

                <div class="columns">
                    <div class="column is-7">
                        <h2 class="title is-4">Popular this week</h2>
                        <p v-if="!view.activity.popular_charts.length" class="has-text-grey">Nobody has played this week yet.</p>
                        <div v-else class="table-container">
                            <table class="table is-fullwidth is-hoverable">
                                <caption class="is-sr-only">Most played charts this week</caption>
                                <thead><tr><th scope="col">Chart</th><th scope="col" class="is-numeric">Keys</th><th scope="col" class="is-numeric">Plays</th><th scope="col" class="is-numeric is-hidden-mobile">Players</th></tr></thead>
                                <tbody><tr v-for="entry in view.activity.popular_charts" :key="entry.chart.hash">

                                ['mapper', 'Mapper', 'is-hidden-mobile', 'asc'],
                                ['key_count', 'Keys', 'is-numeric', 'desc'],
                                ['difficulty', 'Difficulty', 'is-numeric', 'desc'],
                                ['length', 'Length', 'is-numeric is-hidden-mobile', 'desc'],
                                ['play_count', 'Plays', 'is-numeric is-hidden-mobile', 'desc'],
                            ]" :key="field" scope="col" :class="classes" :aria-sort="ariaSort(field, {sort: 'play_count', order: 'desc'})">
                                <sort-link :field="field" :label="label" :defaults="{sort: 'play_count', order: 'desc'}" :first="first"></sort-link>
                            </th>
                            <th scope="col" class="is-hidden-mobile">Source</th>
                            <th scope="col" class="is-hidden-mobile">Status</th>
                        </tr></thead>
                        <tbody><tr v-for="chart in view.charts" :key="chart.hash">
                            <td class="chart-name">
                                <a :href="$link.chart(chart.hash)">{{ chart.artist }} - {{ chart.title }}</a> <span class="has-text-grey">[{{ chart.difficulty_name }}]</span>
                            </td>
                            <td class="is-hidden-mobile">{{ chart.mapper }}</td>
                            <td class="is-numeric">{{ chart.key_count }}K</td>
                            <td class="is-numeric"><difficulty-value :value="chart.difficulty"></difficulty-value></td>
                            <td class="is-numeric is-hidden-mobile">{{ $f.length(chart.duration_ms) }}</td>
                            <td class="is-numeric is-hidden-mobile">{{ $f.number(chart.play_count) }}</td>
                            <td class="is-hidden-mobile">{{ $f.source(chart) }}</td>
                            <td class="is-hidden-mobile"><span class="tag" :class="chart.status === 'ranked' ? 'is-success is-dark' : 'is-light'">{{ chart.status }}</span></td>
                        </tr></tbody>
                    </table>
                </div>
                <pager :total="view.total"></pager>
            </template>

            <template v-else-if="route.name === 'chart'">
                <h1 class="title mb-1">{{ view.titles.main }}</h1>
                <p v-if="view.titles.sub" class="has-text-grey mb-2">{{ view.titles.sub }}</p>
                <p class="subtitle is-6 mt-2">
                    [{{ view.chart.difficulty_name }}] by {{ view.chart.mapper }}
                    <span class="tag is-light" :class="{'is-success': view.chart.status === 'ranked'}">{{ view.chart.status }}</span>
                    <span class="tag is-light">{{ $f.source(view.chart) }}</span>
                </p>
                <div class="buttons chart-links">
                    <a v-for="download in view.downloads" :key="download.url" class="button is-small is-primary" :href="download.url" rel="noopener noreferrer">Download from {{ download.name }}</a>
                    <a v-for="page in view.pages" :key="page.url" class="button is-small" :href="page.url" target="_blank" rel="noopener noreferrer">{{ page.name }} page</a>
                    <button type="button" class="button is-small is-ghost report-link" @click="openReport('chart', view.chart.hash, view.titles.main + ' [' + view.chart.difficulty_name + ']')">Report chart</button>
                </div>
                <div v-if="admin" class="box staff-tools">
                    <p class="has-text-weight-semibold mb-2">Staff</p>
                    <p v-if="staffError" class="help is-danger mb-2" role="alert">{{ staffError }}</p>
                    <button v-if="view.chart.status === 'ranked'" type="button" class="button is-small is-danger is-light" :disabled="reviewBusy === 'chart-' + view.chart.hash" @click="setChartStatus(view.chart, 'unranked')">Unrank chart</button>
                    <button v-else type="button" class="button is-small is-success is-light" :disabled="reviewBusy === 'chart-' + view.chart.hash" @click="setChartStatus(view.chart, 'ranked')">Rank chart</button>
                </div>

                <div class="chart-headline box">
                    <div class="chart-difficulty">
                        <p class="stat-label">Difficulty at {{ $f.rate(view.rate) }}</p>
                        <p class="difficulty-value" :style="{color: $f.difficultyColor(view.difficulty)}">{{ $f.performance(view.difficulty) }}</p>
                    </div>
                    <div v-for="[label, value] in [
                        ['Keys', view.chart.key_count + 'K'],
                        ['Length', $f.length(view.chart.duration_ms / view.rate)],
                        ['Notes', $f.number(view.chart.note_count)],
                        ['Holds', $f.number(view.chart.hold_count)],
                        ['Plays', $f.number(view.chart.play_count)],
                    ]" class="play-stat">
                        <p class="stat-label">{{ label }}</p><p class="stat-value">{{ value }}</p>
                    </div>
                </div>

                <chart-preview :hash="view.chart.hash" :rate="view.rate"></chart-preview>

                <div class="tabs mt-5">
                    <ul aria-label="Leaderboard">
                        <li :class="{'is-active': !view.performance}"><a :href="$link.chart(view.chart.hash, view.performance ? 1 : view.board.rate)" :aria-current="!view.performance ? 'page' : null">Accuracy</a></li>
                        <li :class="{'is-active': view.performance}"><a :href="$link.chartPerformance(view.chart.hash)" :aria-current="view.performance ? 'page' : null">Performance</a></li>
                    </ul>
                </div>
                <template v-if="view.performance">
                    <p class="mb-4 has-text-grey">Each player's best performance across every rate &middot; {{ $f.number(view.board.total) }} players</p>
                    <pager :total="view.board.total" top></pager>
                    <play-table :plays="view.board.entries" show-user :show-chart="false" caption="Performance leaderboard"
                        :empty="view.chart.status === 'ranked' ? 'Nobody has a ranked play on this chart yet.' : 'Only ranked charts give performance.'"></play-table>
                    <pager :total="view.board.total"></pager>
                </template>
                <template v-else>
                    <div class="field is-grouped is-grouped-multiline is-align-items-center mb-4">
                        <label class="title is-5 mb-0 mr-3" for="rate-select">Leaderboard at</label>
                        <div class="select">
                            <select id="rate-select" @change="go($event.target.value)">
                                <option v-for="entry in view.chart.difficulties" :key="entry.rate" :value="$link.chart(view.chart.hash, entry.rate)" :selected="entry.rate === view.board.rate">
                                    {{ $f.rate(entry.rate) }} &middot; {{ $f.performance(entry.difficulty) }} difficulty &middot; {{ $f.number(view.players[entry.rate] || 0) }} players
                                </option>
                            </select>
                        </div>
                    </div>
                    <pager :total="view.board.total" top></pager>
                    <play-table :plays="view.board.entries" show-user :show-chart="false" empty="Nobody has played this rate yet." :caption="'Leaderboard at ' + $f.rate(view.board.rate)"></play-table>
                    <pager :total="view.board.total"></pager>
                </template>
            </template>

            <template v-else-if="route.name === 'login'">
                <h1 class="title is-3">Sign in</h1>
                <div class="box auth-box">
                    <form @submit.prevent="signIn($event)">
                        <div class="field">
                            <label class="label" for="login-name">Username or email</label>
                            <div class="control"><input id="login-name" class="input" name="login" autocomplete="username" required></div>
                        </div>
                        <div class="field">
                            <label class="label" for="login-password">Password</label>
                            <div class="control"><input id="login-password" class="input" type="password" name="password" autocomplete="current-password" required></div>
                        </div>
                        <p v-if="formError" class="help is-danger mb-3" role="alert">{{ formError }}</p>
                        <div class="auth-actions">
                            <button class="button is-primary" :class="{'is-loading': busy === 'sign-in'}" type="submit">Sign in</button>
                            <a v-if="view.passwordReset" href="/forgot">Forgot your password?</a>
                        </div>
                    </form>
                </div>
                <p class="has-text-grey">New here? Create an account from the account screen in the game.</p>
            </template>

            <template v-else-if="route.name === 'forgot'">
                <h1 class="title is-3">Forgot password</h1>
                <div class="box auth-box">
                    <p v-if="!view.enabled">This server can't send email, so ask a staff member to reset your password.</p>
                    <div v-else-if="view.sent" role="status">
                        <p class="mb-2">If that account exists, a reset link is on its way to the email address it was registered with. The link works for an hour.</p>
                        <p class="has-text-grey">Nothing after a few minutes? Check your spam folder.</p>
                    </div>
                    <form v-else @submit.prevent="requestReset($event)">
                        <p class="mb-4">Enter your username or email and you'll get a link to choose a new password.</p>
                        <div class="field">
                            <label class="label" for="forgot-login">Username or email</label>
                            <div class="control"><input id="forgot-login" class="input" name="login" autocomplete="username" required></div>
                        </div>
                        <p v-if="formError" class="help is-danger mb-3" role="alert">{{ formError }}</p>
                        <button class="button is-primary" :class="{'is-loading': busy === 'forgot'}" type="submit">Send reset link</button>
                    </form>
                </div>
                <a href="/login">Back to sign in</a>
            </template>

            <template v-else-if="route.name === 'reset'">
                <h1 class="title is-3">Choose a new password</h1>
                <div class="box auth-box">
                    <p v-if="!view.token">This link is incomplete. Open it from the email again, or <a href="/forgot">ask for a new one</a>.</p>
                    <form v-else @submit.prevent="confirmReset($event)">
                        <div class="field">
                            <label class="label" for="reset-password">New password</label>
                            <div class="control"><input id="reset-password" class="input" type="password" name="new_password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
                            <p class="help">At least 8 characters.</p>
                        </div>
                        <div class="field">
                            <label class="label" for="reset-confirm">Confirm new password</label>
                            <div class="control"><input id="reset-confirm" class="input" type="password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
                        </div>
                        <p v-if="formError" class="help is-danger mb-3" role="alert">{{ formError }}</p>
                        <button class="button is-primary" :class="{'is-loading': busy === 'reset'}" type="submit">Change password</button>
                    </form>
                </div>
                <p v-if="view.token" class="has-text-grey">Link expired? <a href="/forgot">Ask for a new one</a>.</p>
            </template>

            <template v-else-if="route.name === 'verify'">
                <h1 class="title is-3">{{ view.verified ? "Email verified" : "Verify your email" }}</h1>
                <div class="box auth-box">
                    <p v-if="view.verified">Thanks, {{ view.username }}. Your email is verified and your plays will be submitted.</p>
                    <p v-else-if="!view.token">This link is incomplete. Open it from the email again, or send a new one from your <a href="/account">account page</a>.</p>
                    <p v-else class="has-text-danger" role="alert">{{ view.error }}</p>
                </div>
                <p v-if="!view.verified && view.token" class="has-text-grey">Need a new link? Send one from your <a href="/account">account page</a>.</p>
            </template>

            <template v-else-if="route.name === 'account'">
                <div class="level is-mobile mb-4">
                    <div class="level-left"><h1 class="title is-3">Account</h1></div>
                    <div class="level-right"><button type="button" class="button is-small" @click="signOut()">Sign out</button></div>
                </div>
                <p v-if="formError" class="notification is-danger is-light" role="alert">{{ formError }}</p>
                <div v-if="view.verification && view.user.email_verified === false" class="notification is-warning is-light">
                    <p class="mb-2">Your email isn't verified yet, so your plays won't be submitted. Open the link we emailed you, or send a new one.</p>
                    <button type="button" class="button is-small" :class="{'is-loading': busy === 'verify'}" @click="sendVerification()">Send verification email</button>
                </div>
                <div class="columns">
                    <div class="column is-5">
                        <div class="box">
                            <h2 class="title is-5">Profile</h2>
                            <p class="mb-1"><a :href="$link.user(view.user.username)">{{ view.user.username }}</a></p>
                            <p class="has-text-grey mb-1"><span v-if="showEmail">{{ view.user.email }}</span><span v-else aria-label="Email hidden">•••••@•••</span> <button type="button" class="button is-small is-text reveal-button" :aria-pressed="showEmail" @click="showEmail = !showEmail">{{ showEmail ? "Hide" : "Show" }}</button></p>
                            <p class="has-text-grey">Joined <rel-time :value="view.user.created_at"></rel-time></p>
                        </div>
                        <div class="box">
                            <h2 class="title is-5">Change password</h2>
                            <form @submit.prevent="changePassword($event)">
                                <input type="text" name="username" autocomplete="username" :value="view.user.username" hidden>
                                <div class="field">
                                    <label class="label" for="account-current">Current password</label>
                                    <div class="control"><input id="account-current" class="input" type="password" name="current_password" autocomplete="current-password" required></div>
                                </div>
                                <div class="field">
                                    <label class="label" for="account-new">New password</label>
                                    <div class="control"><input id="account-new" class="input" type="password" name="new_password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
                                </div>
                                <div class="field">
                                    <label class="label" for="account-confirm">Confirm new password</label>
                                    <div class="control"><input id="account-confirm" class="input" type="password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
                                </div>
                                <button class="button is-primary" :class="{'is-loading': busy === 'password'}" type="submit">Change password</button>
                            </form>
                        </div>
                        <div class="box">
                            <h2 class="title is-5">Your data</h2>
                            <p class="mb-3">Download everything Nascent stores about your account, or delete it. See the <a href="/privacy">privacy policy</a> for details.</p>
                            <button type="button" class="button is-small" :class="{'is-loading': busy === 'export'}" @click="exportAccount">Download my data</button>
                            <form class="mt-5" @submit.prevent="deleteAccount($event)">
                                <input type="text" name="username" autocomplete="username" :value="view.user.username" hidden>
                                <div class="field">
                                    <label class="label" for="delete-password">Delete account</label>
                                    <p class="help mb-2">This permanently deletes your account, plays, replays and signed in devices. Charts you uploaded stay, without your name on them.</p>
                                    <div class="control"><input id="delete-password" class="input" type="password" name="password" autocomplete="current-password" placeholder="Your password" required></div>
                                </div>
                                <button class="button is-small is-danger" :class="{'is-loading': busy === 'delete'}" type="submit">Delete my account</button>
                            </form>
                        </div>
                    </div>
                    <div class="column">
                        <div class="box">
                            <h2 class="title is-5">Signed in devices</h2>
                            <div class="table-container">
                                <table class="table is-fullwidth">
                                    <thead><tr><th>Device</th><th>Address <button type="button" class="button is-small is-text reveal-button" :aria-pressed="showAddresses" @click="showAddresses = !showAddresses">{{ showAddresses ? "Hide" : "Show" }}</button></th><th>Last used</th><th><span class="is-sr-only">Actions</span></th></tr></thead>
                                    <tbody>
                                        <tr v-for="entry in view.sessions" :key="entry.id">
                                            <td class="session-client" :title="entry.client">{{ $f.client(entry.client) }} <span v-if="entry.current" class="tag is-info is-light">this browser</span></td>
                                            <td><span v-if="showAddresses">{{ entry.ip }}</span><span v-else class="has-text-grey" aria-label="Address hidden">•••</span></td>
                                            <td><rel-time :value="entry.last_used_at"></rel-time></td>
                                            <td class="has-text-right"><button v-if="!entry.current" type="button" class="button is-small" :class="{'is-loading': busy === 'session-' + entry.id}" @click="revokeSession(entry)">Sign out</button></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <button type="button" class="button is-small is-danger is-light" @click="signOut(true)">Sign out everywhere</button>
                        </div>
                    </div>
                </div>
            </template>

            <template v-else-if="route.name === 'privacy' || route.name === 'terms'">
                <div class="content legal">
                    <h1 class="title is-3">{{ view.title }}</h1>
                    <div v-html="view.html"></div>
                </div>
            </template>

            <template v-else-if="route.name === 'staff'">
                <template v-if="!view.allowed">
                    <h1 class="title is-3">Staff</h1>
                    <p class="notification is-warning is-light">You're signed in as {{ user?.username }}, which can't review plays.</p>
                </template>
                <template v-else>
                    <div class="level is-mobile mb-4">
                        <div class="level-left"><h1 class="title is-3">Review queue</h1></div>
                    </div>
                    <div class="tabs">
                        <ul>
                            <li :class="{'is-active': view.status === 'pending_review'}"><a href="/staff">Flagged plays</a></li>
                            <li :class="{'is-active': view.status === 'rejected'}"><a :href="$link.to('/staff', {status: 'rejected'})">Rejected plays</a></li>
                            <li :class="{'is-active': view.status === 'reports'}"><a :href="$link.to('/staff', {status: 'reports'})">Reports<span v-if="view.openReports" class="tag is-warning is-rounded ml-2">{{ view.openReports }}</span></a></li>
                            <li :class="{'is-active': view.status === 'closed'}"><a :href="$link.to('/staff', {status: 'closed'})">Closed reports</a></li>
                        </ul>
                    </div>
                    <p v-if="staffError" class="notification is-danger is-light" role="alert">{{ staffError }}</p>

                    <template v-if="view.status === 'reports' || view.status === 'closed'">
                        <p v-if="!view.reports.length" class="has-text-grey">{{ view.status === 'reports' ? 'No open reports.' : 'No closed reports yet.' }}</p>
                        <div v-for="report in view.reports" :key="report.id" class="box review-item">
                            <p class="mb-1">
                                <span class="tag is-light mr-1">{{ report.kind }}</span>
                                <strong>{{ $f.reportReason(report.kind, report.reason) }}</strong>
                                &middot; reported by <a v-if="report.reporter" :href="$link.user(report.reporter.username)">{{ report.reporter.username }}</a><span v-else class="has-text-grey">a deleted account</span>
                                &middot; <rel-time :value="report.created_at"></rel-time>
                            </p>
                            <p v-if="report.play" class="title is-5 mb-2">
                                <a :href="$link.play(report.play.id)">{{ report.play.user.username }} &middot; {{ $f.accuracy(report.play.accuracy) }} on {{ report.play.chart.artist }} - {{ report.play.chart.title }} [{{ report.play.chart.difficulty_name }}]</a>
                                <span v-if="report.play.status === 'rejected'" class="tag is-warning is-light ml-1">rejected</span>
                            </p>
                            <p v-else-if="report.user" class="title is-5 mb-2">
                                <a :href="$link.user(report.user.username)">{{ report.user.username }}</a>
                                <span v-if="report.user.is_restricted" class="tag is-danger is-light ml-1">restricted</span>
                            </p>
                            <p v-else-if="report.chart" class="title is-5 mb-2">
                                <a :href="$link.chart(report.chart.hash, 1)">{{ report.chart.artist }} - {{ report.chart.title }} [{{ report.chart.difficulty_name }}]</a>
                                <span class="tag is-light ml-1" :class="{'is-success': report.chart.status === 'ranked'}">{{ report.chart.status }}</span>
                            </p>
                            <p v-else class="has-text-grey mb-2">The reported item was deleted.</p>
                            <p v-if="report.details" class="report-details mb-3">{{ report.details }}</p>
                            <template v-if="report.status === 'open'">
                                <div class="buttons mb-2">
                                    <button v-if="report.play && report.play.status !== 'rejected'" type="button" class="button is-small is-danger is-light" :disabled="reviewBusy === 'report-' + report.id" @click="rejectReported(report)">Reject play</button>
                                    <button v-if="report.user && !report.user.is_restricted" type="button" class="button is-small is-danger is-light" :disabled="reviewBusy === 'user-' + report.user.id" @click="restrictUser(report.user, true, ({user}) => (report.user.is_restricted = user.is_restricted))">Restrict {{ report.user.username }}</button>
                                    <button v-if="admin && report.chart && report.chart.status === 'ranked'" type="button" class="button is-small is-danger is-light" :disabled="reviewBusy === 'chart-' + report.chart.hash" @click="setChartStatus(report.chart, 'unranked', ({chart}) => (report.chart.status = chart.status))">Unrank chart</button>
                                </div>
                                <div class="field has-addons review-actions">
                                    <div class="control is-expanded"><input class="input is-small" v-model="reviewNotes['report-' + report.id]" placeholder="Note (optional)" :aria-label="'Note for report ' + report.id"></div>
                                    <div class="control"><button type="button" class="button is-small is-success" :disabled="reviewBusy === 'report-' + report.id" @click="resolveReport(report, 'resolved')">Resolve</button></div>
                                    <div class="control"><button type="button" class="button is-small" :disabled="reviewBusy === 'report-' + report.id" @click="resolveReport(report, 'dismissed')">Dismiss</button></div>
                                </div>
                                <p class="help">Resolving or dismissing also closes the other open reports about the same {{ report.kind }}.</p>
                            </template>
                            <p v-else class="has-text-grey">
                                {{ report.status === 'resolved' ? 'Resolved' : 'Dismissed' }} by {{ report.resolved_by?.username ?? 'a deleted account' }} <rel-time :value="report.resolved_at"></rel-time><template v-if="report.resolution_note">: {{ report.resolution_note }}</template>
                            </p>
                        </div>
                    </template>

                    <template v-else>
                        <p v-if="!view.plays.length" class="has-text-grey">Nothing here.</p>
                        <div v-for="play in view.plays" :key="play.id" class="box review-item">
                            <p class="mb-1"><a :href="$link.user(play.user.username)">{{ play.user.username }}</a> &middot; <rel-time :value="play.submitted_at"></rel-time></p>
                            <p class="title is-5 mb-2"><a :href="$link.play(play.id)">{{ play.chart.artist }} - {{ play.chart.title }} [{{ play.chart.difficulty_name }}]</a></p>
                            <p class="mb-2">{{ $f.accuracy(play.accuracy) }} &middot; {{ $f.rate(play.rate) }} &middot; {{ play.ranked ? $f.performance(play.performance) + ' performance' : 'Unranked' }}</p>
                            <ul class="review-flags mb-3">
                                <li v-for="(flag, index) in play.flags" :key="index"><strong>{{ flag.message }}</strong> <span class="has-text-grey">{{ $f.flag(flag) }}</span></li>
                            </ul>
                            <p v-if="play.review_note" class="has-text-grey mb-2">Note: {{ play.review_note }}</p>
                            <div class="field has-addons review-actions">
                                <div class="control is-expanded"><input class="input is-small" v-model="reviewNotes[play.id]" placeholder="Note (optional)" :aria-label="'Note for play ' + play.id"></div>
                                <div class="control"><button type="button" class="button is-small is-success" :disabled="reviewBusy === play.id" @click="review(play, 'approve')">Approve</button></div>
                                <div class="control"><button type="button" class="button is-small is-danger" :disabled="reviewBusy === play.id" @click="review(play, 'reject')">Reject</button></div>
                            </div>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </main>

    <div v-if="reporting" class="modal is-active" role="dialog" aria-modal="true" aria-labelledby="report-title" @keydown.esc="closeReport">
        <div class="modal-background" @click="closeReport"></div>
        <div class="modal-card report-dialog">
            <header class="modal-card-head">
                <p id="report-title" class="modal-card-title">{{ reporting.title }}</p>
                <button type="button" class="delete" aria-label="Close" @click="closeReport"></button>
            </header>
            <section class="modal-card-body">
                <template v-if="reportSent">
                    <p class="mb-2"><strong>Thanks, your report was sent.</strong></p>
                    <p class="has-text-grey">A moderator will look at it. You won't get a reply about each report.</p>
                </template>
                <form v-else id="report-form" @submit.prevent="sendReport">
                    <p class="mb-4 has-text-grey">{{ reporting.label }}</p>
                    <fieldset class="field">
                        <legend class="label">What's wrong?</legend>
                        <div class="control report-reasons">
                            <label v-for="[value, label] in reporting.reasons" :key="value" class="radio">
                                <input type="radio" name="reason" :value="value" v-model="reportForm.reason"> {{ label }}
                            </label>
                        </div>
                    </fieldset>
                    <div class="field">
                        <label class="label" for="report-details">Details <span class="has-text-grey has-text-weight-normal">(optional)</span></label>
                        <div class="control"><textarea id="report-details" class="textarea" rows="4" maxlength="1000" v-model="reportForm.details" placeholder="Anything that helps a moderator, like where in the replay to look"></textarea></div>
                    </div>
                    <p v-if="reportError" class="help is-danger" role="alert">{{ reportError }}</p>
                </form>
            </section>
            <footer class="modal-card-foot">
                <div class="buttons">
                    <button v-if="reportSent" type="button" class="button" @click="closeReport">Close</button>
                    <template v-else>
                        <button type="submit" form="report-form" class="button is-danger" :class="{'is-loading': reportBusy}" :disabled="reportBusy">Send report</button>
                        <button type="button" class="button" @click="closeReport">Cancel</button>
                    </template>
                </div>
            </footer>
        </div>
    </div>

    <footer v-if="!['difficulty', 'diffv2', 'diffv3'].includes(route.name)" class="footer has-text-centered is-size-7 has-text-grey">
        Nascent &middot; <a :href="release?.page || 'https://github.com/qwertyquerty/nascent/releases'">Download</a> &middot; <a href="https://github.com/qwertyquerty/nascent">Source</a> &middot; <a href="https://discord.gg/f538azJwXT" target="_blank" rel="noopener">Discord</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/terms">Terms</a> &middot; <a href="/staff">Staff</a>
    </footer>
</template>
<div id="app" v-cloak></div>
</body>
</html>
