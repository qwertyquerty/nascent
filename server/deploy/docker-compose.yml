name: nascent

x-server: &server
  image: nascent-server:${NASCENT_RELEASE:-local}
  pull_policy: never
  restart: unless-stopped
  environment:
    NASCENT_DATABASE_URL: postgresql+psycopg://nascent:${NASCENT_POSTGRES_PASSWORD:?set NASCENT_POSTGRES_PASSWORD}@postgres/nascent
    NASCENT_REDIS_URL: redis://redis:6379/0
    NASCENT_TASKS_INLINE: "0"
    NASCENT_STORAGE_PATH: /storage
    NASCENT_USE_X_ACCEL_REDIRECT: "1"
    NASCENT_TRUST_PROXY_HOPS: "1"
    NASCENT_CORS_ORIGINS: ${NASCENT_CORS_ORIGINS:-}
    UWSGI_PROCESSES: ${NASCENT_UWSGI_PROCESSES:-4}
    UWSGI_THREADS: ${NASCENT_UWSGI_THREADS:-4}
    NASCENT_WEB_DIR: /srv/web
  volumes:
    - ${NASCENT_DATA_DIR:-./data}/storage:/storage
    - ../web:/srv/web:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nascent
      POSTGRES_PASSWORD: ${NASCENT_POSTGRES_PASSWORD:?set NASCENT_POSTGRES_PASSWORD}
      POSTGRES_DB: nascent
    volumes:
      - ${NASCENT_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascent -d nascent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${NASCENT_DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  api:
    <<: *server
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  worker:
    <<: *server
    command: ["flask", "--app", "wsgi", "nascent", "worker"]
    deploy:
      replicas: ${NASCENT_WORKERS:-2}

  scheduler:
    <<: *server
    init: true
    command: ["sh", "-c", "while true; do flask --app wsgi nascent prune; flask --app wsgi nascent snapshot-ranks; sleep 86400; done"]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    environment:
      PGHOST: postgres
      PGUSER: nascent
      PGDATABASE: nascent
      PGPASSWORD: ${NASCENT_POSTGRES_PASSWORD:?set NASCENT_POSTGRES_PASSWORD}
      KEEP_DAYS: ${NASCENT_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${NASCENT_DATA_DIR:-./data}/backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          file=/backups/nascent-$$(date -u +%Y%m%dT%H%M%SZ).dump
          pg_dump --format=custom --file="$$file.partial" && mv "$$file.partial" "$$file" && echo "wrote $$file"
          find /backups -name 'nascent-*.dump' -mtime +"$$KEEP_DAYS" -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/nginx/nascent/start.sh"]
    environment:
      NASCENT_DOMAIN: ${NASCENT_DOMAIN:-}
      NASCENT_DOMAINS: ${NASCENT_DOMAINS:-}
    ports:
      - "${NASCENT_HTTP_PORT:-80}:80"
      - "${NASCENT_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/nascent:ro
      - ../web:/srv/web:ro
      - ../../assets/skins/default/display_font.ttf:/srv/fonts/display_font.ttf:ro
      - ../../assets/skins:/srv/skins:ro
      - ${NASCENT_DATA_DIR:-./data}/storage:/storage:ro
      - ${NASCENT_DATA_DIR:-./data}/letsencrypt:/etc/letsencrypt:ro
      - ${NASCENT_DATA_DIR:-./data}/certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  pgadmin:
    image: dpage/pgadmin4:9.1
    profiles: [db-admin]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${NASCENT_DB_ADMIN_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${NASCENT_DB_ADMIN_PASSWORD:-}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/nascent-servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "127.0.0.1:${NASCENT_DB_ADMIN_PORT:-5050}:80"
    volumes:
      - ${NASCENT_DATA_DIR:-./data}/pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/nascent-servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/misc/ping"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
    logging: *logging

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while true; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 43200 & wait $$!
        done
    volumes:
      - ${NASCENT_DATA_DIR:-./data}/letsencrypt:/etc/letsencrypt
      - ${NASCENT_DATA_DIR:-./data}/certbot-www:/var/www/certbot
    logging: *logging
