[uwsgi]
strict = true
master = true
chdir = /app
pythonpath = /app
module = wsgi:app
need-app = true
lazy-apps = true
single-interpreter = true
enable-threads = true
processes = 4
threads = 2

socket = :8000
http-socket = 127.0.0.1:8001
buffer-size = 16384

die-on-term = true
vacuum = true
harakiri = 60
max-requests = 20000
max-requests-delta = 1000
reload-on-rss = 1024

ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

auto-procname = true
procname-prefix-spaced = nascent
log-format = %(addr) %(method) %(uri) %(status) %(size)B %(msecs)ms
