- name: Set a player's password
  hosts: nascent
  become: true
  gather_facts: false
  vars_prompt:
    - name: player
      prompt: Player name
      private: false
    - name: password
      prompt: New password (at least 8 characters)
      private: true
      confirm: true
  tasks:
    - name: Set the password
      ansible.builtin.import_role:
        name: nascent
        tasks_from: set_password
