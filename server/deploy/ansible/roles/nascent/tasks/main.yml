- name: Check the settings
  ansible.builtin.assert:
    that: nascent_domain | length == 0 or nascent_letsencrypt_email | length > 0
    fail_msg: set nascent_letsencrypt_email to get a certificate for {{ nascent_domain }}

- name: Install git and curl
  ansible.builtin.apt:
    name: [git, curl, ca-certificates, ufw]
    update_cache: true
    cache_valid_time: 3600

- name: Check for docker
  ansible.builtin.command: docker compose version
  register: docker_compose
  changed_when: false
  failed_when: false

- name: Install docker
  when: docker_compose.rc != 0
  block:
    - name: Add the docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add the docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker

    - name: Install docker
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]

- name: Open ssh, http and https in the firewall
  when: nascent_configure_firewall | bool
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["{{ ansible_port | default(22) }}", "80", "443"]

- name: Enable the firewall
  when: nascent_configure_firewall | bool
  community.general.ufw:
    state: enabled

- name: Add swap so the image can compile
  when: ansible_memtotal_mb < 3000 and ansible_swaptotal_mb == 0
  block:
    - name: Create the swap file
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    - name: Restrict the swap file
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Enable the swap file
      ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
      changed_when: true

    - name: Keep the swap file after reboots
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

- name: Create the data directories
  ansible.builtin.file:
    path: /opt/nascent/data/{{ item }}
    state: directory
  loop: [postgres, redis, backups, letsencrypt, certbot-www]

- name: Create the storage directory
  ansible.builtin.file:
    path: /opt/nascent/data/storage
    state: directory
    owner: "10001"

- name: Generate the database password
  ansible.builtin.shell: umask 077 && openssl rand -hex 24 > /opt/nascent/postgres-password
  args:
    creates: /opt/nascent/postgres-password

- name: Read the database password
  ansible.builtin.slurp:
    src: /opt/nascent/postgres-password
  register: postgres_password

- name: Check out {{ nascent_ref }}
  ansible.builtin.git:
    repo: "{{ nascent_repo }}"
    dest: /opt/nascent/src
    version: "{{ nascent_ref }}"
    recursive: false
    force: true
  register: checkout

- name: Write the compose settings
  vars:
    nascent_release: "{{ checkout.after[:12] }}"
    nascent_postgres_password: "{{ postgres_password.content | b64decode | trim }}"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nascent_compose_dir }}/.env"
    mode: "0600"

- name: Build and start release {{ checkout.after[:12] }}
  block:
    - name: Build the image
      ansible.builtin.command: docker compose build api
      args:
        chdir: "{{ nascent_compose_dir }}"
      changed_when: true

    - name: Start the stack and wait for it to be healthy
      ansible.builtin.command: docker compose up -d --remove-orphans --wait --wait-timeout 300
      args:
        chdir: "{{ nascent_compose_dir }}"
      changed_when: true
  rescue:
    - name: Collect the logs
      ansible.builtin.command: docker compose logs --tail 50 api nginx
      args:
        chdir: "{{ nascent_compose_dir }}"
      register: logs
      changed_when: false
      failed_when: false

    - name: Fail with the logs
      ansible.builtin.fail:
        msg: "{{ logs.stdout }}"

- name: Read which certificate is installed
  ansible.builtin.slurp:
    src: /opt/nascent/data/letsencrypt/nascent-domain
  register: certificate_marker
  failed_when: false

- name: Get a certificate for {{ nascent_domain }}
  vars:
    certificate_wanted: "{{ nascent_domain }} staging={{ nascent_letsencrypt_staging | bool }}"
  when: nascent_domain | length > 0 and (certificate_marker.content | default('') | b64decode) != certificate_wanted
  block:
    - name: Request the certificate
      ansible.builtin.command: >-
        docker compose run --rm --no-deps --entrypoint certbot certbot certonly --webroot -w /var/www/certbot --cert-name nascent
        -d {{ nascent_domain }} --email {{ nascent_letsencrypt_email }} --agree-tos --no-eff-email --non-interactive --force-renewal
        {{ '--staging' if nascent_letsencrypt_staging | bool else '' }}
      args:
        chdir: "{{ nascent_compose_dir }}"
      changed_when: true

    - name: Remember the certificate
      ansible.builtin.copy:
        content: "{{ certificate_wanted }}"
        dest: /opt/nascent/data/letsencrypt/nascent-domain
        mode: "0644"

    - name: Switch nginx to https
      ansible.builtin.command: docker compose restart nginx
      args:
        chdir: "{{ nascent_compose_dir }}"
      changed_when: true
  rescue:
    - name: Explain the missing certificate
      ansible.builtin.debug:
        msg: no certificate yet, check that {{ nascent_domain }} points at this server; serving http until the next run

- name: Remove images from older releases
  ansible.builtin.shell: |
    docker images nascent-server --format '{% raw %}{{.Tag}}{% endraw %}' | grep -vx "{{ checkout.after[:12] }}" | xargs -r -I tag docker image rm nascent-server:tag
    docker image prune -f
  changed_when: false
