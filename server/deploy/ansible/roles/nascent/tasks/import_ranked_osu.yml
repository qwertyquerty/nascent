- name: Download, convert and rank every ranked osu!mania map
  ansible.builtin.command:
    argv: [docker, compose, exec, -T, api, flask, --app, wsgi, nascent, import-ranked-osu, --per-minute, "{{ nascent_osu_requests_per_minute }}"]
    chdir: "{{ nascent_compose_dir }}"
  async: 14400
  poll: 60
  register: imported
  changed_when: "not imported.stdout_lines[-1].startswith('0 new ')"

- name: Show what was imported
  ansible.builtin.debug:
    msg: "{{ imported.stdout_lines | select('match', '^(skipped|[0-9])') | list }}"
