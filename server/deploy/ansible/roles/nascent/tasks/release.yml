- name: Check the settings
  ansible.builtin.assert:
    that: nascent_domain | length == 0 or nascent_letsencrypt_email | length > 0
    fail_msg: set nascent_letsencrypt_email to get a certificate for {{ nascent_domain }}

- name: Read the database password
  ansible.builtin.slurp:
    src: /opt/nascent/postgres-password
  register: postgres_password

- name: Check whether the database admin is on
  ansible.builtin.stat:
    path: /opt/nascent/db-admin/password
  register: db_admin_password_file

- name: Read the database admin login
  when: db_admin_password_file.stat.exists
  ansible.builtin.slurp:
    src: /opt/nascent/db-admin/{{ item }}
  loop: [email, password]
  register: db_admin_login
  no_log: true

- name: Remember the database admin login
  ansible.builtin.set_fact:
    db_admin_enabled: "{{ db_admin_password_file.stat.exists }}"
    db_admin_email: "{{ (db_admin_login.results[0].content | b64decode | trim) if db_admin_password_file.stat.exists else '' }}"
    db_admin_password: "{{ (db_admin_login.results[1].content | b64decode | trim) if db_admin_password_file.stat.exists else '' }}"
  no_log: true

- name: Check out {{ nascent_ref }}
  ansible.builtin.git:
    repo: "{{ nascent_repo }}"
    dest: /opt/nascent/src
    version: "{{ nascent_ref }}"
    recursive: false
    force: true
  register: checkout

- name: Write the compose settings
  vars:
    nascent_release: "{{ checkout.after[:12] }}"
    nascent_postgres_password: "{{ postgres_password.content | b64decode | trim }}"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nascent_compose_dir }}/.env"
    mode: "0600"

- name: Fetch Cloudflare's address ranges
  when: nascent_cloudflare | bool
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-{{ item }}
    return_content: true
  loop: [v4, v6]
  register: cloudflare_ranges

- name: Trust client addresses from Cloudflare
  when: nascent_cloudflare | bool
  ansible.builtin.template:
    src: cloudflare.conf.j2
    dest: "{{ nascent_compose_dir }}/nginx/cloudflare.conf"
    mode: "0644"
  register: cloudflare_conf

- name: Stop trusting Cloudflare
  when: not nascent_cloudflare | bool
  ansible.builtin.file:
    path: "{{ nascent_compose_dir }}/nginx/cloudflare.conf"
    state: absent
  register: cloudflare_removed

- name: Build and start release {{ checkout.after[:12] }}
  block:
    - name: Build the image
      ansible.builtin.command: docker compose build api
      args:
        chdir: "{{ nascent_compose_dir }}"
      changed_when: true

    - name: Swap in the new api without dropping requests
      ansible.builtin.shell: |
        {% raw %}
        set -eu
        old=$(docker compose ps -q api)

        if [ -z "$old" ] || [ -z "$(docker compose ps -q nginx)" ]; then
          echo "nothing running yet, starting fresh"
          exit 0
        fi

        docker compose up -d --no-deps --no-recreate --scale api=$(($(echo "$old" | wc -l) + 1)) api
        new=$(docker compose ps -q api | grep -vxF "$old")

        for attempt in $(seq 1 150); do
          health=$(docker inspect -f '{{.State.Health.Status}}' "$new")
          [ "$health" = healthy ] && break

          if [ "$health" = unhealthy ] || [ "$attempt" = 150 ]; then
            docker logs --tail 50 "$new" >&2
            docker rm -f "$new"
            echo "the new api never became healthy, the old one is still serving" >&2
            exit 1
          fi

          sleep 2
        done

        name=$(docker inspect -f '{{.Name}}' "$new")
        docker compose exec -T -e NASCENT_API="${name#/}:8000" nginx sh /etc/nginx/nascent/start.sh reload
        docker compose exec -T nginx sh -c 'sleep 1; for i in $(seq 1 90); do pgrep -f "[s]hutting down" > /dev/null || exit 0; sleep 1; done'
        docker stop -t 30 $old
        docker rm $old
        echo "swapped in ${name#/}"
        {% endraw %}
      args:
        chdir: "{{ nascent_compose_dir }}"
        executable: /bin/bash
      register: api_swap
      changed_when: "'swapped in' in api_swap.stdout"

    - name: Start the rest of the stack and wait for it to be healthy
      ansible.builtin.command: docker compose up -d --remove-orphans --wait --wait-timeout 300
      args:
        chdir: "{{ nascent_compose_dir }}"
      changed_when: true

    - name: Reload nginx to pick up the new release and Cloudflare settings
      when: checkout is changed or cloudflare_conf is changed or cloudflare_removed is changed
      ansible.builtin.command: docker compose exec -T nginx sh /etc/nginx/nascent/start.sh reload
      args:
        chdir: "{{ nascent_compose_dir }}"
      changed_when: true
  rescue:
    - name: Collect the logs
      ansible.builtin.command: docker compose logs --tail 50 api nginx {{ 'pgadmin' if db_admin_enabled | bool else '' }}
      args:
        chdir: "{{ nascent_compose_dir }}"
      register: logs
      changed_when: false
      failed_when: false

    - name: Fail with the logs
      ansible.builtin.fail:
        msg: "{{ logs.stdout }}"

- name: Read which certificate is installed
  ansible.builtin.slurp:
    src: /opt/nascent/data/letsencrypt/nascent-domain
  register: certificate_marker
  failed_when: false

- name: Get a certificate for {{ nascent_all_domains | join(', ') }}
  vars:
    certificate_wanted: "{{ nascent_all_domains | join(',') }} staging={{ nascent_letsencrypt_staging | bool }}"
  when: nascent_domain | length > 0 and (certificate_marker.content | default('') | b64decode) != certificate_wanted
  block:
    - name: Request the certificate
      ansible.builtin.command: >-
        docker compose run --rm --no-deps --entrypoint certbot certbot certonly --webroot -w /var/www/certbot --cert-name nascent
        {{ nascent_all_domains | map('regex_replace', '^', '-d ') | join(' ') }} --email {{ nascent_letsencrypt_email }} --agree-tos --no-eff-email --non-interactive --force-renewal
        {{ '--staging' if nascent_letsencrypt_staging | bool else '' }}
      args:
        chdir: "{{ nascent_compose_dir }}"
      changed_when: true

    - name: Remember the certificate
      ansible.builtin.copy:
        content: "{{ certificate_wanted }}"
        dest: /opt/nascent/data/letsencrypt/nascent-domain
        mode: "0644"

    - name: Switch nginx to https
      ansible.builtin.command: docker compose exec -T nginx sh /etc/nginx/nascent/start.sh reload
      args:
        chdir: "{{ nascent_compose_dir }}"
      changed_when: true
  rescue:
    - name: Explain the missing certificate
      ansible.builtin.debug:
        msg: no certificate yet, check that {{ nascent_all_domains | join(', ') }} all point at this server; serving http until the next run

- name: Remove images from older releases
  ansible.builtin.shell: |
    docker images nascent-server --format '{% raw %}{{.Tag}}{% endraw %}' | grep -vx "{{ checkout.after[:12] }}" | xargs -r -I tag docker image rm nascent-server:tag
    docker image prune -f
  changed_when: false
