- name: Install git and curl
  ansible.builtin.apt:
    name: [git, curl, ca-certificates, ufw]
    update_cache: true
    cache_valid_time: 3600

- name: Check for docker
  ansible.builtin.command: docker compose version
  register: docker_compose
  changed_when: false
  failed_when: false

- name: Install docker
  when: docker_compose.rc != 0
  block:
    - name: Add the docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add the docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker

    - name: Install docker
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]

- name: Open ssh, http and https in the firewall
  when: nascent_configure_firewall | bool
  ansible.builtin.command: ufw allow {{ item }}/tcp
  loop: ["{{ ansible_port | default(22) }}", "80", "443"]
  register: firewall_rule
  changed_when: "'Skipping' not in firewall_rule.stdout"

- name: Check the firewall
  when: nascent_configure_firewall | bool
  ansible.builtin.command: ufw status
  register: firewall_status
  changed_when: false

- name: Enable the firewall
  when:
    - nascent_configure_firewall | bool
    - "'Status: active' not in firewall_status.stdout"
  ansible.builtin.command: ufw --force enable
  changed_when: true

- name: Add swap so the image can compile
  when: ansible_memtotal_mb < 3000 and ansible_swaptotal_mb == 0
  block:
    - name: Create the swap file
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    - name: Restrict the swap file
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Enable the swap file
      ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
      changed_when: true

    - name: Keep the swap file after reboots
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

- name: Create the data directories
  ansible.builtin.file:
    path: /opt/nascent/data/{{ item }}
    state: directory
  loop: [postgres, redis, backups, letsencrypt, certbot-www]

- name: Create the storage directory
  ansible.builtin.file:
    path: /opt/nascent/data/storage
    state: directory
    owner: "10001"

- name: Generate the database password
  ansible.builtin.shell: umask 077 && openssl rand -hex 24 > /opt/nascent/postgres-password
  args:
    creates: /opt/nascent/postgres-password
