- name: Fingerprint every play that doesn't have one yet
  ansible.builtin.command:
    argv: [docker, compose, exec, -T, api, flask, --app, wsgi, nascent, backfill-fingerprints]
    chdir: "{{ nascent_compose_dir }}"
  async: 7200
  poll: 15
  register: backfilled
  changed_when: backfilled.rc == 0

- name: Report the result
  ansible.builtin.debug:
    msg: "{{ backfilled.stdout_lines[-1] | default('done') }}"
