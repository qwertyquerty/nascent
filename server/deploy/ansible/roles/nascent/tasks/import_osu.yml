- name: Check the map link
  ansible.builtin.assert:
    that: url is defined and url | length > 0
    fail_msg: pass the map with -e url=https://osu.ppy.sh/beatmapsets/...

- name: Download, convert and rank the map
  ansible.builtin.command:
    argv: [docker, compose, exec, -T, api, flask, --app, wsgi, nascent, import-osu, "{{ url }}", --mirror, "{{ nascent_osz_mirror }}"]
    chdir: "{{ nascent_compose_dir }}"
  register: imported
  changed_when: "'added ' in imported.stdout"

- name: Show what was imported
  ansible.builtin.debug:
    msg: "{{ imported.stdout_lines }}"
