- name: Check the settings
  ansible.builtin.assert:
    that:
      - charts is defined and charts | length > 0
    fail_msg: pass a local chart folder or .tar.gz archive with -e charts=/path/to/charts. Add -e rank=true to rank every imported chart, -e replace=true to replace charts that import differently now and remove ones that are no longer valid, and -e dry_run=true to only report what would change

- name: Look for the charts on this machine
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.stat:
    path: "{{ charts }}"
  register: chart_folder

- name: Decide whether the charts are already packed
  ansible.builtin.set_fact:
    chart_archive_given: "{{ (chart_folder.stat.isreg | default(false)) and (charts.endswith('.tar.gz') or charts.endswith('.tgz')) }}"

- name: Check the charts exist
  ansible.builtin.assert:
    that: (chart_folder.stat.isdir | default(false)) or chart_archive_given
    fail_msg: "{{ charts }} isn't a folder or a .tar.gz archive on this machine. In WSL, check the drive is mounted (for example sudo mount -t drvfs R: /mnt/r)"

- name: Count the chart files on this machine
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.shell: find {{ charts | quote }} -type f \( -iname '*.osu' -o -iname '*.sm' -o -iname '*.ssc' -o -iname '*.dwi' -o -iname '*.json' \) ! -name pack.json | wc -l
  register: local_charts
  changed_when: false
  when: not chart_archive_given

- name: Check there are charts to import
  ansible.builtin.assert:
    that: local_charts.stdout | int > 0
    fail_msg: no .osu, .sm, .ssc, .dwi or .json chart files in {{ charts }}
  when: not chart_archive_given

- name: Upload and import the charts
  block:
    - name: Clear the upload directory for the archive
      ansible.builtin.file:
        path: "{{ nascent_chart_import_dir }}"
        state: absent
      when: chart_archive_given

    - name: Create the upload directory
      ansible.builtin.file:
        path: "{{ nascent_chart_import_dir }}"
        state: directory
        mode: "0755"

    - name: Unpack the chart archive on the server
      ansible.builtin.unarchive:
        src: "{{ charts }}"
        dest: "{{ nascent_chart_import_dir }}"
        mode: u=rwX,g=rX,o=rX
      when: chart_archive_given

    - name: Install rsync on the server
      ansible.builtin.package:
        name: rsync
        state: present
      when: not chart_archive_given

    - name: Sync {{ local_charts.stdout | default('the') | trim }} chart files to the server, sending only what changed
      ansible.posix.synchronize:
        src: "{{ charts | regex_replace('/+$', '') }}/"
        dest: "{{ nascent_chart_import_dir }}/"
        delete: true
        compress: true
        owner: false
        group: false
        rsync_opts:
          - "--include=*/"
          - "--include=*.[oO][sS][uU]"
          - "--include=*.[sS][mM]"
          - "--include=*.[sS][sS][cC]"
          - "--include=*.[dD][wW][iI]"
          - "--include=*.[jJ][sS][oO][nN]"
          - "--exclude=*"
          - "--prune-empty-dirs"
          - "--delete-excluded"
          - "--chmod=D755,F644"
      when: not chart_archive_given

    - name: Build the import command
      ansible.builtin.set_fact:
        chart_import_command: >-
          {{ ['docker', 'compose', 'run', '--rm', '-T', '-v', nascent_chart_import_dir ~ ':/import:ro', 'api', 'flask', '--app', 'wsgi', 'nascent', 'import-charts', '/import', '--quiet']
             + (['--rank'] if rank | default(false) | bool else [])
             + (['--replace'] if replace | default(false) | bool else [])
             + (['--dry-run'] if dry_run | default(false) | bool else []) }}

    - name: Import the charts{{ ' as ranked' if rank | default(false) | bool else '' }}{{ ', replacing older versions' if replace | default(false) | bool else '' }}{{ ' (dry run)' if dry_run | default(false) | bool else '' }}
      ansible.builtin.command:
        argv: "{{ chart_import_command }}"
        chdir: "{{ nascent_compose_dir }}"
      async: "{{ nascent_chart_import_timeout }}"
      poll: 60
      register: imported
      changed_when: "imported.stdout_lines | select('search', '^[1-9][0-9]* new charts|replaced [1-9][0-9]* older versions|removed [1-9][0-9]* invalid charts') | list | length > 0"

    - name: Show what was imported
      ansible.builtin.debug:
        msg: "{{ imported.stdout_lines | reject('match', '^[0-9]+/[0-9]+ files:') | list }}"
  always:
    - name: Remove the unpacked archive
      ansible.builtin.file:
        path: "{{ nascent_chart_import_dir }}"
        state: absent
      when: chart_archive_given
