- name: Check the settings
  ansible.builtin.assert:
    that:
      - player | default('') | length > 0
      - password | default('') | length >= 8
    fail_msg: pass the player's name and a password of at least 8 characters

- name: Set the password for {{ player }}
  ansible.builtin.command:
    argv: [docker, compose, exec, -T, api, flask, --app, wsgi, nascent, set-password, "{{ player }}", --password-stdin]
    chdir: "{{ nascent_compose_dir }}"
    stdin: "{{ password }}"
  register: set_password
  changed_when: set_password.rc == 0
  failed_when: false
  no_log: true

- name: Report the result
  ansible.builtin.debug:
    msg: "{{ set_password.stdout | trim }}"
  when: set_password.rc == 0

- name: Fail with the reason
  ansible.builtin.fail:
    msg: "{{ set_password.stderr | trim }}"
  when: set_password.rc != 0
