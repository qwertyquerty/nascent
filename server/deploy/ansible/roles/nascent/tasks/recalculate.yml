- name: Recalculate plays and profiles
  ansible.builtin.command:
    argv: "{{ ['docker', 'compose', 'exec', '-T', 'api', 'flask', '--app', 'wsgi', 'nascent', 'recalculate'] + (['--resimulate'] if resimulate | default(false) | bool else []) }}"
    chdir: "{{ nascent_compose_dir }}"
  async: 7200
  poll: 15
  register: recalculated
  changed_when: recalculated.rc == 0

- name: Report the result
  ansible.builtin.debug:
    msg: "{{ recalculated.stdout_lines + (['the worker is processing the queued jobs in the background'] if recalculated.stdout is search('queued') else []) }}"
