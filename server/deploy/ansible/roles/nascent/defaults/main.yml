nascent_repo: https://github.com/qwertyquerty/nascent.git
nascent_ref: main

nascent_domain: ""
nascent_domain_aliases: []
nascent_all_domains: "{{ ([nascent_domain] + nascent_domain_aliases) | select | unique | list }}"
nascent_letsencrypt_email: ""
nascent_letsencrypt_staging: false
nascent_cors_origins: ""
nascent_min_client_version: ""
nascent_email_verification: false

nascent_resend_api_key: ""
nascent_mail_domain: "{{ nascent_domain }}"
nascent_mail_from: "{{ 'Nascent <noreply@' ~ nascent_mail_domain ~ '>' if nascent_mail_domain | length > 0 else '' }}"
nascent_smtp_host: "{{ 'smtp.resend.com' if nascent_resend_api_key | length > 0 else '' }}"
nascent_smtp_port: 587
nascent_smtp_security: starttls
nascent_smtp_username: "{{ 'resend' if nascent_resend_api_key | length > 0 else '' }}"
nascent_smtp_password: "{{ nascent_resend_api_key }}"

nascent_workers: 2
nascent_uwsgi_processes: 4
nascent_uwsgi_threads: 4
nascent_backup_keep_days: 14
nascent_configure_firewall: true
nascent_cloudflare: false
nascent_db_admin_email: "{{ nascent_letsencrypt_email }}"
nascent_db_admin_port: 5050
nascent_replay_import_dir: /opt/nascent/replay-import
nascent_difficulty_deploy: true
nascent_difficulty_force: false
nascent_difficulty_job_timeout: 21600
nascent_difficulty_report_dir: /opt/nascent/difficulty-reports
